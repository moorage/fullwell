name: default
setup:
  - npm install
  - npm run hooks:install || true

actions:
  install_hooks:
    run: npm run hooks:install
  verify:
    run: npm run verify
  verify_sensitive:
    run: npm run verify:sensitive
  verify_ideas:
    run: npm run verify:ideas
  verify_docs:
    run: npm run verify:docs
  verify_execplan:
    run: npm run verify:execplan
  test_git_hooks:
    run: npm run test:git-hooks
  test_knowledge:
    run: npm run test:knowledge
  start_container_system:
    run: npm run container:system:start
  start_local_postgres:
    run: npm run container:postgres:start
  stop_local_postgres:
    run: npm run container:postgres:stop
  status_local_postgres:
    run: npm run container:postgres:status
  verify_local_postgres:
    run: npm run container:postgres:verify
  build_local_container:
    run: npm run container:build
  refresh_knowledge:
    run: npm run knowledge:refresh
  suggest_doc_updates:
    run: npm run knowledge:suggest
  refresh_context:
    run: npm run self-improve:context
  capture_screencast:
    run: npm run capture:screencast -- --output artifacts/screencasts/manual-capture.mp4

name: household-food-journal

services:
  app:
    image: ${HFJ_IMAGE:?set HFJ_IMAGE to an immutable digest}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_ORIGIN: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      AUTH_MODE: session
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:?set APPLE_CLIENT_ID}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:?set APPLE_TEAM_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID:?set APPLE_KEY_ID}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      HOUSEHOLD_REPOSITORY_ROOT: /data/households
      HOUSEHOLD_WORKTREE_ROOT: /data/households/.worktrees
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_DIRECT_URL_FILE: /run/secrets/database_direct_url
      TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      SESSION_SECRET_FILE: /run/secrets/session_secret
      APPLE_PRIVATE_KEY_FILE: /run/secrets/apple_private_key
      MAIL_PROVIDER_API_KEY_FILE: /run/secrets/mail_provider_api_key
      GIT_SIGNING_KEY_FILE: /run/secrets/git_signing_key
    secrets:
      - database_url
      - database_direct_url
      - token_pepper
      - session_secret
      - apple_private_key
      - mail_provider_api_key
      - git_signing_key
    volumes:
      - type: bind
        source: /data/households
        target: /data/households
        bind:
          propagation: rprivate
    tmpfs:
      - /tmp:size=128m,mode=1770,uid=10001,gid=10001
    networks: [private]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s

  gateway:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=32m,mode=1770
    networks: [private]
    depends_on:
      app:
        condition: service_healthy

networks:
  private:
    internal: false

volumes:
  caddy_data:
  caddy_config:

secrets:
  database_url:
    file: ${CREDENTIALS_DIRECTORY:?systemd credential directory required}/database-url
  database_direct_url:
    file: ${CREDENTIALS_DIRECTORY}/database-direct-url
  token_pepper:
    file: ${CREDENTIALS_DIRECTORY}/token-pepper
  session_secret:
    file: ${CREDENTIALS_DIRECTORY}/session-secret
  apple_private_key:
    file: ${CREDENTIALS_DIRECTORY}/apple-private-key
  mail_provider_api_key:
    file: ${CREDENTIALS_DIRECTORY}/mail-provider-api-key
  git_signing_key:
    file: ${CREDENTIALS_DIRECTORY}/git-signing-key

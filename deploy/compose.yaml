name: household-food-journal

services:
  app:
    image: ${HFJ_IMAGE:?set HFJ_IMAGE to an immutable digest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_ORIGIN: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      AUTH_MODE: session
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:?set APPLE_CLIENT_ID}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:?set APPLE_TEAM_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID:?set APPLE_KEY_ID}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      HOUSEHOLD_REPOSITORY_ROOT: /data/households
      HOUSEHOLD_WORKTREE_ROOT: /data/households/.worktrees
      EXPORT_ROOT: /data/households/.exports
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?set Backblaze B2 S3 endpoint}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:?set Backblaze B2 region}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?set private backup bucket}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-household-food-journal/v1}
      BACKUP_KEY_ID: ${BACKUP_KEY_ID:?set backup key identifier}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      OPENAI_REVIEW_ENABLED: ${OPENAI_REVIEW_ENABLED:-false}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_WEBHOOK_ENABLED: ${WHATSAPP_WEBHOOK_ENABLED:-false}
      WHATSAPP_LINKING_ENABLED: ${WHATSAPP_LINKING_ENABLED:-false}
      WHATSAPP_RUNNER_CLAIMS_ENABLED: ${WHATSAPP_RUNNER_CLAIMS_ENABLED:-false}
      WHATSAPP_SERVICE_REPLIES_ENABLED: ${WHATSAPP_SERVICE_REPLIES_ENABLED:-false}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-service_only}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_FREE_SERVICE_SEND_CUTOFF: ${WHATSAPP_FREE_SERVICE_SEND_CUTOFF:-2026-10-01T00:00:00-07:00}
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_DIRECT_URL_FILE: /run/secrets/database_direct_url
      TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      SESSION_SECRET_FILE: /run/secrets/session_secret
      OPERATOR_TOKEN_FILE: /run/secrets/operator_token
      APPLE_PRIVATE_KEY_FILE: /run/secrets/apple_private_key
      MAIL_PROVIDER_API_KEY_FILE: /run/secrets/mail_provider_api_key
      OPENAI_REVIEW_USERNAME_FILE: /run/secrets/openai_review_username
      OPENAI_REVIEW_PASSWORD_FILE: /run/secrets/openai_review_password
      OPENAI_APPS_CHALLENGE_FILE: /run/secrets/openai_apps_challenge
      GIT_SIGNING_KEY_FILE: /run/secrets/git_signing_key
      GIT_ALLOWED_SIGNERS_FILE: /run/secrets/git_allowed_signers
      OBJECT_STORAGE_ACCESS_KEY_ID_FILE: /run/secrets/object_storage_access_key_id
      OBJECT_STORAGE_SECRET_ACCESS_KEY_FILE: /run/secrets/object_storage_secret_access_key
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
      BACKUP_MANIFEST_PRIVATE_KEY_FILE: /run/secrets/backup_manifest_private_key
      BACKUP_MANIFEST_PUBLIC_KEY_FILE: /run/secrets/backup_manifest_public_key
      WHATSAPP_BUSINESS_ACCOUNT_ID_FILE: /run/secrets/whatsapp_business_account_id
      WHATSAPP_PHONE_NUMBER_ID_FILE: /run/secrets/whatsapp_phone_number_id
      WHATSAPP_CONTACT_URL_FILE: /run/secrets/whatsapp_contact_url
      WHATSAPP_APP_SECRET_FILE: /run/secrets/whatsapp_app_secret
      WHATSAPP_ACCESS_TOKEN_FILE: /run/secrets/whatsapp_access_token
      WHATSAPP_VERIFY_TOKEN_FILE: /run/secrets/whatsapp_verify_token
      MESSAGE_ENCRYPTION_KEY_FILE: /run/secrets/message_encryption_key
    secrets:
      - database_url
      - database_direct_url
      - token_pepper
      - session_secret
      - operator_token
      - apple_private_key
      - mail_provider_api_key
      - openai_review_username
      - openai_review_password
      - openai_apps_challenge
      - git_signing_key
      - git_allowed_signers
      - object_storage_access_key_id
      - object_storage_secret_access_key
      - backup_encryption_key
      - backup_manifest_private_key
      - backup_manifest_public_key
      - whatsapp_business_account_id
      - whatsapp_phone_number_id
      - whatsapp_contact_url
      - whatsapp_app_secret
      - whatsapp_access_token
      - whatsapp_verify_token
      - message_encryption_key
    volumes:
      - type: bind
        source: /data/households
        target: /data/households
        bind:
          propagation: rprivate
    tmpfs:
      - /tmp:size=128m,mode=1770,uid=10001,gid=10001
    networks: [private]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s

  gateway:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=32m,mode=1770
    networks: [private]
    depends_on:
      app:
        condition: service_healthy

networks:
  private:
    internal: false

volumes:
  caddy_data:
  caddy_config:

secrets:
  database_url:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY:?runtime credential directory required}/database-url
  database_direct_url:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/database-direct-url
  token_pepper:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/token-pepper
  session_secret:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/session-secret
  operator_token:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/operator-token
  apple_private_key:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/apple-private-key
  mail_provider_api_key:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/mail-provider-api-key
  openai_review_username:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/openai-review-username
  openai_review_password:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/openai-review-password
  openai_apps_challenge:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/openai-apps-challenge
  git_signing_key:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/git-signing-key
  git_allowed_signers:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/git-allowed-signers
  object_storage_access_key_id:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/object-storage-access-key-id
  object_storage_secret_access_key:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/object-storage-secret-access-key
  backup_encryption_key:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/backup-encryption-key
  backup_manifest_private_key:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/backup-manifest-private-key
  backup_manifest_public_key:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/backup-manifest-public-key
  whatsapp_business_account_id:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/whatsapp-business-account-id
  whatsapp_phone_number_id:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/whatsapp-phone-number-id
  whatsapp_contact_url:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/whatsapp-contact-url
  whatsapp_app_secret:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/whatsapp-app-secret
  whatsapp_access_token:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/whatsapp-access-token
  whatsapp_verify_token:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/whatsapp-verify-token
  message_encryption_key:
    file: ${DEPLOY_CREDENTIALS_DIRECTORY}/message-encryption-key
